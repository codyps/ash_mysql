services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2025-latest
    user: root
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "AdminFor278"
      MSSQL_PID: "Developer"
    ports:
      - "21539:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U SA -P AdminFor278 -C -Q 'SELECT 1' || exit 0"]
      interval: 5s
      timeout: 3s
      retries: 8
      start_period: 20s

volumes:
  mssql-data:
